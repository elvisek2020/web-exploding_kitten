services:
  vybusna-kotatka:
    build:
      context: .
      dockerfile: Dockerfile
#    image: ghcr.io/elvisek2020/web-exploding_kitten:latest
    container_name: vybusna-kotatka
    ports:
      - "8080:8000"
    environment:
      # Heslo pro admin rezim Super Power. Nastav ho v souboru .env vedle
      # tohoto souboru (viz .env.example), nebo ho sem napis primo misto
      # ${ADMIN_PASSWORD:-}. Bez hesla je admin rezim vypnuty.
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - TOKEN_EXPIRY_SECONDS=${TOKEN_EXPIRY_SECONDS:-3600}
      # Prazdne = WebSocket jen ze stejne domeny, na ktere hra bezi.
      # Za reverse proxy, ktera prepisuje hlavicku Host, nastav konkretni
      # origin (napr. "https://kotatka.example.com"); "*" = libovolny web.
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      # Kolik sekund se ceka na navrat odpojeneho hrace, nez vypadne ze hry
      - DISCONNECT_GRACE_SECONDS=${DISCONNECT_GRACE_SECONDS:-15}
      # IP reverse proxy, jejimz X-Forwarded-For hlavickam se ma verit
      # (napr. "172.20.0.1"); "*" = verit vsem (jen pokud je port nepristupny primo)
      - FORWARDED_ALLOW_IPS=${FORWARDED_ALLOW_IPS:-127.0.0.1}
    restart: unless-stopped
